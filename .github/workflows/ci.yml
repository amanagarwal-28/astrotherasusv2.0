name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Import smoke test
        run: |
          python -c "
          import importlib
          mods = [
              'physics_engine', 'orbital_physics', 'query_rag', 'intent_parser',
              'rebound_engine', 'scenario_validator', 'visualizer',
              'websocket_server', 'orbital_accuracy',
          ]
          for m in mods:
              importlib.import_module(m)
          print('All modules imported successfully.')
          "

      - name: Syntax-check every Python file
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Run offline validation suite (unit tests + physics regression checks)
        run: python -m pytest -m "not network" -v

      - name: Run Horizons-dependent validation suite (best-effort)
        continue-on-error: true
        run: python -m pytest -m network -v

      - name: Regenerate integrator benchmark figure
        run: python benchmarks/integrator_comparison.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: integrator-benchmark
          path: benchmarks/results/
